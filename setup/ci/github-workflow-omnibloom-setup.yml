# Builds Omnibloom Setup for Windows, macOS and Linux and attaches the files to the GitHub release.
# Lives in egomortal/omnibloom; the Setup source is in setup/. Staged only; not pushed yet.
name: Omnibloom Setup

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: Omnibloom-Setup.exe
            asset: Omnibloom-Setup-Windows.exe
          - os: macos-latest
            file: Omnibloom-Setup
            asset: Omnibloom-Setup-macOS
          - os: ubuntu-latest
            file: Omnibloom-Setup
            asset: Omnibloom-Setup-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test tools
        run: python -m pip install pyinstaller==6.16.0 pyftpdlib==2.0.1 pillow==11.0.0
      - name: Tests against the fake console
        run: python -m unittest tests.test_end_to_end tests.test_oneclick -v
      - name: Window walk-through (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python tests/gui_smoke.py shots
      - name: Build one-file app
        run: pyinstaller --noconfirm omnibloom-setup.spec
      - name: Checksum
        shell: bash
        run: |
          cd dist
          cp "${{ matrix.file }}" "${{ matrix.asset }}"
          python -c "import hashlib,sys;p=sys.argv[1];print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p)" "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.sha256" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: setup/dist/${{ matrix.asset }}*
