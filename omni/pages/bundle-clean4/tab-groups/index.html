<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>Omni · Tab groups</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="groups.css"></head><body><a class="skip" href="#content">Skip to content</a><main id="content"><p class="eyebrow">OMNIBLOOM · TABS</p><div class="toolbar"><div><h1>A place for every tab</h1><p>Group a project. Pin the tabs you come back to.</p></div><div class="row"><button id="new-group" class="primary">New group</button><button id="manage">Manage groups</button></div></div><nav id="filters" class="row" aria-label="Tab groups"></nav><p id="count"></p><div id="tabs" class="grid"></div><div id="failure" class="error" hidden><p>Tabs could not be loaded. Saved data has not been replaced.</p><button id="retry">Try again</button></div><p id="status" role="status" aria-live="polite"></p></main><div id="group-editor" class="overlay" role="dialog" aria-modal="true" aria-labelledby="group-title" hidden><section class="dialog"><h2 id="group-title">New group</h2><label>Group name<input id="group-name" maxlength="32" autocomplete="off"></label><label>Colour<select id="group-color"><option value="blue">Blue</option><option value="pink">Pink</option><option value="mint">Mint</option><option value="amber">Amber</option><option value="violet">Violet</option><option value="silver">Silver</option></select></label><p id="group-error" role="alert"></p><div class="row"><button id="save-group" class="primary">Save group</button><button data-close>Cancel</button></div></section></div><div id="actions" class="overlay" role="dialog" aria-modal="true" aria-labelledby="action-title" hidden><section class="dialog"><h2 id="action-title">Tab options</h2><button id="pin">Pin tab</button><label>Group<select id="membership"></select></label><div class="row"><button id="save-membership" class="primary">Move to group</button><button data-close>Back</button></div></section></div><div id="manager" class="overlay" role="dialog" aria-modal="true" aria-labelledby="manager-title" hidden><section class="dialog"><h2 id="manager-title">Manage groups</h2><div id="group-list"></div><p>Removing a group keeps its tabs open.</p><button data-close>Back</button></section></div><footer class="hint">D-pad · Move &nbsp; × · Select &nbsp; ○ · Back</footer><script src="model.js"></script><script src="ui.js"></script><script src="app.js"></script></body></html>
