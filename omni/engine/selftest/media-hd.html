<!doctype html><meta charset="utf-8"><title>Omni video player</title>
<style>
body{margin:0;padding:24px;background:#0b1514;color:#e7f3ed;font:18px sans-serif}h1{font-size:26px;margin:0 0 10px}p{color:#a5bcb2;margin:8px 0}video{display:block;width:80vw;max-height:65vh;margin:auto;background:#000;border:1px solid #304c40}pre{font:14px monospace;white-space:pre-wrap;color:#9ee982}
</style><h1>OMNI / Video player</h1><p>Local playback validation · H.264 + AAC · 1280 × 720</p>
<video muted playsinline controls></video><pre></pre>
<script>
window.omniFeatureResults=[];const video=document.querySelector('video');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function record(name,pass,value){omniFeatureResults.push({name,pass,value});document.querySelector('pre').textContent=omniFeatureResults.map(x=>(x.pass?'PASS':'FAIL')+' · '+x.name+' '+JSON.stringify(x.value||'')).join('\n');}
function event(name,action){return new Promise((resolve,reject)=>{const t=setTimeout(()=>done(Error(name+' timeout')),5500);function done(e){clearTimeout(t);video.removeEventListener(name,ok);video.removeEventListener('error',bad);e?reject(e):resolve();}const ok=()=>done(),bad=()=>done(Error('media error '+video.error?.code));video.addEventListener(name,ok);video.addEventListener('error',bad);action();});}
(async()=>{try{
 await event('loadeddata',()=>{video.src='media-hd.mp4';video.load();});
 record('720p metadata',video.videoWidth===1280&&video.videoHeight===720,[video.videoWidth,video.videoHeight]);
 const t=performance.now();await video.play();await event('ended',()=>{});
 record('playback reaches end',video.ended&&video.currentTime>=3.9,{position:video.currentTime,wallSeconds:(performance.now()-t)/1000});
 await event('seeked',()=>video.currentTime=0);await video.play();await wait(400);video.pause();const paused=video.currentTime;await wait(250);
 record('pause holds position',Math.abs(video.currentTime-paused)<0.03,video.currentTime);
 await video.play();await wait(500);video.pause();record('resume advances',video.currentTime>paused+0.2,video.currentTime);
 const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0);record('720p frame readable',ctx.getImageData(0,0,1280,720).data.some((v,i)=>i%4!==3&&v>40));
}catch(e){record('HD integration',false,String(e));}})();
</script>
