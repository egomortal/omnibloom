<!doctype html><meta charset="utf-8"><title>Omni media integration test</title>
<style>body{background:#101820;color:#e8f2ed;font:18px sans-serif}video{width:480px;height:270px}pre{white-space:pre-wrap}</style>
<h1>Omni webpage video test</h1><video muted playsinline controls></video><pre></pre>
<script>
window.omniFeatureResults=[];
const video=document.querySelector('video');
function record(name, pass, value) { omniFeatureResults.push({name,pass,value}); document.querySelector('pre').textContent=JSON.stringify(omniFeatureResults); }
function event(name, action) {
    return new Promise((resolve,reject)=>{
        const timeout=setTimeout(()=>done(Error(name+' timeout')),5000);
        function done(error) {clearTimeout(timeout);video.removeEventListener(name,success);video.removeEventListener('error',failure);error?reject(error):resolve();}
        const success=()=>done(); const failure=()=>done(Error('media error '+(video.error&&video.error.code)));
        video.addEventListener(name,success);video.addEventListener('error',failure);action();
    });
}
(async()=>{
    for(const format of ['mp4','webm']) {
        try {
            await event('loadeddata',()=>{video.src='media-test.'+format;video.load();});
            record(format+' metadata',video.videoWidth===320&&video.videoHeight===180&&Math.abs(video.duration-2)<0.1, [video.videoWidth,video.videoHeight,video.duration]);
            const canvas=document.createElement('canvas');canvas.width=320;canvas.height=180;
            const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0);
            const pixels=ctx.getImageData(0,0,320,180).data;
            record(format+' canvas frame',pixels.some((value,index)=>index%4!==3&&value>40),'visible color pixels');
            await video.play();
            await event('ended',()=>{});
            record(format+' playback',video.ended&&video.currentTime>=1.9,video.currentTime);
            await event('seeked',()=>{video.currentTime=0;});
            record(format+' rewind',video.currentTime<0.1,video.currentTime);
            video.pause();video.removeAttribute('src');video.load();
        } catch(error) {record(format+' integration',false,String(error));}
    }
})();
</script>
