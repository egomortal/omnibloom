<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' blob:;font-src 'self';connect-src 'none';object-src 'none';base-uri 'none';form-action 'none'"><title>Subtitle tools · Omnibloom</title><link rel="stylesheet" href="../shared/components.css"><link rel="stylesheet" href="style.css"><script src="../shared/controller.js" defer></script><script src="subtitles.js" defer></script><script src="tv-controls.js" defer></script><script src="app.js" defer></script></head><body><a class="skip" href="#main">Skip to content</a><main id="main" class="shell"><header class="topline"><span class="brand">OMNIBLOOM</span><span>Subtitle tools</span></header><h1>Subtitle tools</h1><p class="intro">Open a subtitle file, convert its format or adjust every cue together. Your source stays unchanged.</p><section class="fields"><label class="field">Local SRT or VTT<input id="file" type="file" accept=".srt,.vtt,text/vtt,text/plain"></label><label class="field">Available captions<select id="caption"></select></label></section><div class="row section"><button id="fetch" disabled>Get selected captions</button><span id="caption-note">Caption downloads require a connected Downloads host.</span></div><label class="field section">Subtitle text<textarea id="input" spellcheck="false" maxlength="1048576" placeholder="Open a file or paste SRT / WebVTT text"></textarea></label><section class="fields section"><label class="field">Output format<select id="format"><option value="vtt">WebVTT (.vtt)</option><option value="srt">SubRip (.srt)</option></select></label><label class="field">Timing shift in milliseconds<input id="shift" type="number" min="-86400000" max="86400000" step="1" value="0"></label></section><div class="row section"><button id="convert" class="primary">Convert and preview</button><button id="download" disabled>Save subtitle file</button></div><section class="card section"><h2>Preview</h2><p id="summary">No subtitles loaded</p><pre id="output"></pre></section><p id="status" class="section" role="status"></p></main><footer class="hintbar"><span>D-pad · Move</span><span><b class="glyph" data-glyph="accept"></b>Select</span><span><b class="glyph" data-glyph="back"></b>Back</span><button id="glyph-toggle">PlayStation glyphs</button></footer></body></html>
