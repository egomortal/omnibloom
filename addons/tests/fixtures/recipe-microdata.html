<div itemscope itemtype="https://schema.org/WebPage">
 <div itemprop="mainEntity" itemscope itemtype="http://schema.org/Recipe">
  <h1 itemprop="name">Fluffy pancakes</h1>
  <p>Makes <span itemprop="recipeYield">8 pancakes</span>.
   Prep <meta itemprop="prepTime" content="PT10M">10 min, cook <time itemprop="cookTime" datetime="PT15M">15 min</time>.</p>
  <div itemprop="author" itemscope itemtype="https://schema.org/Person"><span itemprop="name">Sam</span></div>
  <ul>
   <li itemprop="recipeIngredient"><span>1 ½</span> cups milk</li>
   <li itemprop="recipeIngredient">2 eggs</li>
   <li itemprop="recipeIngredient">⅓ cup sugar</li>
  </ul>
  <ol itemprop="recipeInstructions">
   <li>Whisk the milk and eggs.</li>
   <li>Rest the batter for 10 minutes.</li>
   <li>Cook each pancake 2 minutes a side.</li>
  </ol>
 </div>
